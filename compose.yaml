x-labels: &app_labels
  labels:
    project_name: ${PROJECT_NAME:-djangotg}

x-common-settings: &common_settings
  build:
    context: ./app
    dockerfile: Dockerfile
  volumes:
    - ./.env:/app/.env
    - static_volume:/app/static
  env_file:
    - .env
  <<: *app_labels
  depends_on:
    - db
    - redis

services:
  web:
    <<: *common_settings
    command: gunicorn server.wsgi:application --bind 0.0.0.0:8000

  bot_processor_tarot:
    <<: *common_settings
    environment:
      - INSTANCE_NAME=tarot
    command: poetry run python manage.py start_bot_processing
    restart: always

  bot_processor_cardparser:
    <<: *common_settings
    environment:
      - INSTANCE_NAME=cardparser
    command: poetry run python manage.py start_bot_processing
    restart: always

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: on-failure:5
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    environment:
      - LOG_LEVEL=info
      - BROWSER_TIMEOUT=120000
      - HEADLESS=true
      - MAX_SESSIONS=1
      - BROWSER_MAX_CONCURRENT=5
      - BROWSER_MAX_TIMEOUT=120000
      - BROWSER_USER_AGENT=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 512MB
        reservations:
          cpus: '0.3'
          memory: 256MB
    tmpfs:
      - /tmp:size=128M,exec
    memswap_limit: 1536M
    <<: *app_labels

  celery:
    <<: *common_settings
    command: poetry run celery -A server worker --loglevel=info

  celery_beat:
    <<: *common_settings
    command: poetry run celery -A server beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  redis:
    image: redis:7
    <<: *app_labels

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django_user} -d ${POSTGRES_DB:-django_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *app_labels

  nginx:
    image: nginx:latest
    ports:
      - "${NGINX_PORT:-81}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_volume:/app/static
    depends_on:
      - web
    <<: *app_labels

volumes:
  postgres_data:
  static_volume: